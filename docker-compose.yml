services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: postgres}
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql", "pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10}
  inventory:
    build: ./inventory
    environment: {DATABASE_URL: "postgresql+psycopg2://app:app@postgres:5432/inventory"}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["8001:8001"]
  notifications:
    build: ./notifications
    ports: ["8003:8003"]
  orders:
    build: ./orders
    environment:
      DATABASE_URL: "postgresql+psycopg2://app:app@postgres:5432/orders"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      INVENTORY_URL: http://inventory:8001
      NOTIFICATIONS_URL: http://notifications:8003
    depends_on: {postgres: {condition: service_healthy}, inventory: {condition: service_started}}
    ports: ["8002:8002"]
volumes: {pgdata: {}}
